name: Week-6 Ticket Management System CI/CD

on:
  push:
    branches: [main]
    paths:
      - "Week-6/Ticket Management System/**"
      - ".github/workflows/week6-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "Week-6/Ticket Management System/**"
      - ".github/workflows/week6-ci-cd.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: Week-6/Ticket Management System

env:
  NODE_VERSION: "20"

jobs:
  # ============================================================================
  # JOB 1: Static Analysis (Lint + TypeScript) & Unit/API Tests + Coverage Gate
  # ============================================================================
  quality-and-tests:
    name: Lint, Typecheck & Unit/API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Week-6/Ticket Management System/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tms_ci?sslmode=disable
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run Vitest suite with >80% coverage threshold
        env:
          JWT_SECRET: ci_test_jwt_secret
        run: npm run test:coverage

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-test-coverage
          path: Week-6/Ticket Management System/coverage

  # ============================================================================
  # JOB 2: Integration Test (Real Postgres Container) + Production Build + Smoke Test
  # ============================================================================
  integration-and-build:
    name: Postgres Integration, Build & Smoke Test
    runs-on: ubuntu-latest
    needs: quality-and-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tms_ci?sslmode=disable
      JWT_SECRET: ci_integration_jwt_secret_2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Week-6/Ticket Management System/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Push Schema to CI Postgres
        run: |
          npx prisma generate
          npx prisma db push

      - name: Seed CI PostgreSQL Database
        run: npm run seed

      - name: Build Next.js production bundle
        run: npm run build

      - name: Start production server & run HTTP smoke tests
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          node .next/standalone/server.js &
          SERVER_PID=$!

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo ""
              echo "Health check passed!"
              break
            fi
            sleep 1
          done

          # Verify health endpoint reports database=connected
          HEALTH_BODY=$(curl -fsS http://127.0.0.1:3000/api/health)
          echo "$HEALTH_BODY" | grep -q '"database":"connected"'

          # Verify auth guard blocks unauthenticated access to /api/tickets with 401
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/tickets)
          echo "Unauthenticated /api/tickets HTTP status: $STATUS_CODE"
          test "$STATUS_CODE" = "401"

          kill $SERVER_PID

  # ============================================================================
  # JOB 3: Docker Image Build Verification (and CD readiness)
  # ============================================================================
  docker-build:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: integration-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        uses: docker/build-push-action@v6
        with:
          context: Week-6/Ticket Management System
          file: Week-6/Ticket Management System/Dockerfile
          push: false
          tags: tms-week6:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
